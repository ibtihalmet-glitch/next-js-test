<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House of Ideas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow"></div>

  <header>
    <img src="logo.png" alt="HI logo" class="logo">
  </header>

  <main>
    <p class="eyebrow">01 / A SPACE FOR BRIGHT MINDS</p>
    <h1><span>WELCOME TO</span><strong>HOUSE OF IDEAS</strong></h1>
  </main>

  <footer>
    <span id="copy">2026 HOUSE OF IDEAS</span>
    <a id="insta" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/>
      </svg>
    </a>
  </footer>

  <script>
    fetch('/api/config').then(r => r.json()).then(c => {
      document.getElementById('insta').href = c.instagram;
      document.getElementById('copy').textContent = c.year + ' HOUSE OF IDEAS';
    });
  </script>
</body>
</html>
